<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registros</title>

  <link rel="stylesheet" href="../css/registros.css">
</head>

<body>

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1>📋 Registros</h1>
    <button onclick="irParaMapa()" style="background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px;">← Voltar ao Mapa</button>
  </div>

  <div class="filtro-container">
    <label for="filtroTipo">Filtrar por tipo:</label>
    <select id="filtroTipo">
      <option value="todos">Todos</option>
      <option value="nds">NDS</option>
      <option value="manutencao">Manutenção</option>
    </select>

    <label for="ordenarId">Ordenar por:</label>
    <select id="ordenarId">
      <option value="desc">Mais recente</option>
      <option value="asc">Mais antigo</option>
    </select>
  </div>

  <div id="lista-nds" class="container-nds"></div>

  <script src="../scripts/registroScript.js"></script>

  <script>
    function irParaMapa() {
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
