<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Pontos de Poda</title>

  <!-- Leaflet + MarkerCluster CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="./css/style.css">

</head>

<body>

<div id="map"></div>

<div class="loc-btn" onclick="goToLocation()">📍 Localizar</div>
<div class="coord-btn" onclick="toggleCoordMode()">📌 Pontos Avulsos</div>

<div class="legend">
  <strong>Legenda</strong><br>
  <input type="checkbox" id="chkBT" checked> Poda BT<br>
  <input type="checkbox" id="chkMT" checked> Poda MT<br>
  <input type="checkbox" id="chkTI" checked> Trocar Isolador
</div>

<div id="modalExecucao">
  <div class="box">
    <h3>Executar ponto</h3>

    <label for="inputEquipe">Equipe *</label><br>
    <select id="inputEquipe" style="box-shadow: none; border: 1px solid black; background-color: white;">
      <option value="LECPNA0801">LECPNA0801</option>
      <option value="LNVPNA0801">LNVPNA0801</option>
      <option value="PLTPNA0601">PLTPNA0601</option>
      <option value="PLTPNA0602">PLTPNA0602</option>
      <option value="PLTPNA0701">PLTPNA0701</option>
      <option value="PLTPNA0702">PLTPNA0702</option>
      <option value="PLTPNA0703">PLTPNA0703</option>
      <option value="PLTPNA0704">PLTPNA0704</option>
      <option value="PLTPNA1502">PLTPNA1502</option>
      <option value="PLTPNA1503">PLTPNA1503</option>
      <option value="PLTPNA1504">PLTPNA1504</option>
      <option value="PLTSJM0601">PLTSJM0601</option>
      <option value="PLTSJM1501">PLTSJM1501</option>
    </select>

    <label>Data *</label>
    <input id="inputData" type="date">

    <label>Descrição</label>
    <textarea id="inputDescricao" rows="3"></textarea>

    <div style="text-align:right">
      <button onclick="fecharModal()" style="background:red;color:#fff;border:none;padding:6px 12px;border-radius:4px">Cancelar</button>
      <button onclick="confirmarExecucao()" style="background:#28a745;color:#fff;border:none;padding:6px 12px;border-radius:4px">
        Confirmar
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script src="scripts/script.js"> </script>

</body>
</html>
